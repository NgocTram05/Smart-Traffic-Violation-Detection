<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video - Smart Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .navbar { 
            background-color: #ffffff !important; 
            border-bottom: 1px solid #dee2e6;
        }
        .navbar-brand { 
            color: #212529 !important; 
            font-weight: bold; 
            font-size: 1.5rem; 
        }
        .nav-link { 
            background: none !important; 
            color: #212529 !important; 
            transition: all 0.3s ease; 
            border-bottom: none;
            font-weight: 500;
        }
        .nav-link:hover { 
            transform: translateY(-2px);
        }
        .nav-link.active { 
            border-bottom: 2px solid #212529;
        }
        .video-box { 
            border: 1px solid #000000; 
            border-radius: 0px; 
            overflow: hidden; 
            background: #ffffff; 
            padding: 5px; 
            height: 480px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .video-placeholder { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #999999; 
        }
        .card { 
            border: 1px solid #dee2e6; 
            border-radius: 0px;
        }
        .card-header { 
            background-color: #f8f9fa; 
            color: #212529; 
            border-bottom: 1px solid #dee2e6; 
            padding: 15px;
        }
        .card-header h5 {
            margin: 0;
            font-weight: bold;
            font-size: 1rem;
        }
        .btn-control {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            font-weight: 500;
            border-radius: 0px;
            padding: 10px 20px;
            font-size: 0.95rem;
            transition: transform 0.2s ease;
            margin-bottom: 10px;
            width: 100%;
        }
        .btn-control:hover {
            transform: translateY(-2px);
            background-color: #ffffff;
            color: #000000;
            border-color: #000000;
        }
        .btn-control:active {
            transform: translateY(0px);
            background-color: #ffffff;
            color: #000000;
        }
        .btn-control:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .container-main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .input-file {
            border: 1px solid #000000;
            border-radius: 0px;
            padding: 8px 12px;
            font-size: 0.95rem;
        }
        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .controls-row {
            margin-top: 20px;
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }
        .results-container {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 0px;
            background-color: #ffffff;
        }
        .result-item {
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 0px;
            margin-bottom: 15px;
            background-color: #ffffff;
        }
        .result-item img {
            border: 1px solid #dee2e6;
            border-radius: 0px;
            max-width: 100%;
            height: auto;
        }
        .alert {
            border-radius: 0px;
            border: 1px solid #000000;
        }
        .alert-info {
            background-color: #f0f0f0;
            color: #000000;
            border-color: #000000;
        }
        .alert-warning {
            background-color: #fff8dc;
            color: #000000;
            border-color: #000000;
        }
        .alert-success {
            background-color: #f0f8f0;
            color: #000000;
            border-color: #000000;
        }
        .alert-danger {
            background-color: #fff0f0;
            color: #000000;
            border-color: #000000;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4 border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            HỆ THỐNG NHẬN DIỆN BIỂN SỐ XE
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link btn btn-success me-2" href="/">
                        Trực Tiếp
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-secondary me-2" href="/history">
                        Lịch Sử
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-primary me-2" href="/upload_image">
                        Upload Ảnh
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-info active" href="/upload_video">
                        Upload Video
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-main">
    <div class="card mb-4">
        <div class="card-header">
            <h5>Bảng Giám Sát Video</h5>
        </div>
        <div class="card-body p-2">
            <div id="videoBox" class="video-box">
                <div id="videoPlaceholder" class="video-placeholder">Không có video. Tải video lên để xem trước.</div>
                <video id="previewVideo" style="display:none; width:100%; height:100%; object-fit:contain;" controls></video>
            </div>
        </div>
    </div>

    <div class="controls-row">
        <div class="row">
            <div class="col-md-8">
                <div class="mb-3">
                    <label for="videoFile" class="form-label">Chọn file video (MP4, AVI, MOV)</label>
                    <input type="file" class="form-control input-file" id="videoFile" accept=".mp4,.avi,.mov">
                </div>
            </div>
        </div>

        <div class="row g-2">
            <div class="col-md-3">
                <button id="btnUpload" class="btn btn-control">Upload File</button>
            </div>
            <div class="col-md-3">
                <button id="btnRun" class="btn btn-control">Run</button>
            </div>
            <div class="col-md-3">
                <button id="btnCancel" class="btn btn-control">Cancel</button>
            </div>
        </div>
    </div>

    <div class="results-container">
        <h5 style="margin-bottom: 20px; font-weight: bold;">Kết Quả</h5>
        <div id="resultsList"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const videoFile = document.getElementById('videoFile');
    const previewVideo = document.getElementById('previewVideo');
    const placeholder = document.getElementById('videoPlaceholder');
    const btnUpload = document.getElementById('btnUpload');
    const btnRun = document.getElementById('btnRun');
    const btnCancel = document.getElementById('btnCancel');
    const resultsList = document.getElementById('resultsList');

    let currentFile = null;

    videoFile.addEventListener('change', () => {
        const f = videoFile.files[0];
        if (!f) return;
        const url = URL.createObjectURL(f);
        previewVideo.src = url;
        placeholder.style.display = 'none';
        previewVideo.style.display = 'block';
        currentFile = f;
    });

    btnUpload.addEventListener('click', () => {
        videoFile.click();
    });

    btnCancel.addEventListener('click', () => {
        videoFile.value = '';
        currentFile = null;
        previewVideo.pause();
        previewVideo.removeAttribute('src');
        previewVideo.style.display = 'none';
        placeholder.style.display = 'flex';
        resultsList.innerHTML = '';
    });

    btnRun.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!videoFile.files.length) { 
            alert('Vui lòng chọn file video trước.'); 
            return; 
        }
        
        previewVideo.play();
        
        btnRun.disabled = true;
        btnRun.innerHTML = 'Đang xử lý...';
        resultsList.innerHTML = '<div class="alert alert-info">Video đang phát... OCR đang theo dõi và ghi nhận biển số...</div>';

        const form = new FormData();
        form.append('file', videoFile.files[0]);

        try {
            const res = await fetch('/api/process_video', { method: 'POST', body: form });
            const data = await res.json();
            if (!data.success) {
                resultsList.innerHTML = '<div class="alert alert-danger">Lỗi: ' + data.message + '</div>';
            } else {
                renderResults(data.plates, data.processed_video_url || data.video_url);
            }
        } catch (err) {
            console.error(err);
            resultsList.innerHTML = '<div class="alert alert-danger">Lỗi kết nối: Không thể kết nối tới server</div>';
        } finally {
            btnRun.disabled = false;
            btnRun.innerHTML = 'Run';
        }
    });

    function renderResults(plates, video_url) {
        resultsList.innerHTML = '';
        if (!plates || plates.length === 0) {
            resultsList.innerHTML = '<div class="alert alert-warning">Không tìm thấy biển số trong video.</div>';
            return;
        }

        const summary = `<div class="alert alert-success mb-3">Hoàn tất! Phát hiện ${plates.length} biển số (không trùng lặp).</div>`;
        resultsList.innerHTML = summary;

        plates.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'result-item';

            let statusText = 'Khác';
            let statusBg = '#f0f0f0';
            
            if (p.color === 'success') {
                statusText = 'Bình thường';
                statusBg = '#f0f8f0';
            } else if (p.color === 'warning') {
                statusText = 'Vi phạm';
                statusBg = '#fff8dc';
            } else if (p.color === 'danger') {
                statusText = 'Mờ/Không rõ';
                statusBg = '#fff0f0';
            }

            card.style.backgroundColor = statusBg;

            card.innerHTML = `
                <div class="row g-3">
                    <div class="col-md-3">
                        <img src="${p.crop_url}" style="border: 1px solid #000000; border-radius: 0px; width:100%; height:auto; max-height:120px; object-fit:cover;">
                    </div>
                    <div class="col-md-9">
                        <div class="mb-2">
                            <strong style="font-size:1.3em;">Biển số: ${p.plate || 'N/A'}</strong>
                            <span style="margin-left: 10px; font-weight: 500;">${statusText}</span>
                        </div>
                        <div class="row g-2 mb-2" style="font-size: 0.9rem;">
                            <div class="col-6"><strong>Loại xe:</strong> ${p.vehicle_type}</div>
                            <div class="col-6"><strong>Thời điểm:</strong> ${p.timestamp}s</div>
                            <div class="col-6"><strong>Frame:</strong> ${p.frame}</div>
                            <div class="col-6"><strong>Độ rõ:</strong> ${p.clarity}</div>
                        </div>
                        <div style="font-size: 0.9rem;"><strong>Chi tiết:</strong> ${p.info}</div>
                        <div class="mt-3">
                            <button class="btn btn-control" style="width: auto; padding: 8px 15px; font-size: 0.9rem;">Lưu vào lịch sử</button>
                        </div>
                    </div>
                </div>
            `;

            resultsList.appendChild(card);

            const saveBtn = card.querySelector('.btn-control');
            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                const originalText = saveBtn.innerHTML;
                saveBtn.innerHTML = 'Đang lưu...';
                
                try {
                    const body = { 
                        plate: p.plate, 
                        status: p.info, 
                        vehicle_type: p.vehicle_type, 
                        violations: p.info ? [p.info] : [] 
                    };
                    const r = await fetch('/api/save_detection', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(body) 
                    });
                    const j = await r.json();
                    
                    if (j.success) {
                        saveBtn.innerHTML = 'Đã lưu';
                        saveBtn.style.opacity = '0.6';
                    } else {
                        saveBtn.innerHTML = 'Lỗi lưu';
                    }
                } catch (err) {
                    saveBtn.innerHTML = 'Lỗi kết nối';
                    console.error(err);
                }
            });
        });
    }
</script>
</body>
</html>
