<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Diện Biển Số Realtime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; margin: 0; padding: 0; }
        .container-fluid { padding: 0; }
        .top-section { display: flex; height: 60vh; }
        .left-menu { width: 200px; background-color: #343a40; color: white; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .video-area { flex: 1; background-color: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .video-placeholder { color: #666; font-size: 48px; }
        .right-panel { width: 300px; background-color: #fff; border-left: 1px solid #ddd; padding: 20px; }
        .bottom-section { height: 40vh; background-color: #fff; border-top: 1px solid #ddd; overflow-y: auto; padding: 20px; }
        .status-item { margin-bottom: 10px; padding: 10px; border-radius: 5px; }
        .detected-plates { display: flex; flex-wrap: wrap; gap: 10px; }
        .plate-card { border: 1px solid #ddd; border-radius: 5px; padding: 10px; min-width: 150px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Phần trên -->
        <div class="top-section">
            <!-- Menu bên trái -->
            <div class="left-menu">
                <h5>Menu</h5>
                <button class="btn btn-light w-100" onclick="document.getElementById('file-input').click()">📁 Thêm File Video</button>
                <input type="file" id="file-input" style="display: none;" accept=".mp4,.avi,.mov">
                <button class="btn btn-success w-100" onclick="startRealtime()">▶️ Run</button>
                <button class="btn btn-warning w-100" onclick="stopRealtime()">⏹️ Stop</button>
                <button class="btn btn-danger w-100" onclick="exitApp()">🚪 Exit</button>
            </div>
            
            <!-- Video chính giữa -->
            <div class="video-area">
                <img id="video" src="{{ url_for('video_feed') }}" style="max-width: 100%; max-height: 100%; display: none;">
                <div id="placeholder" class="video-placeholder">▶️</div>
            </div>
            
            <!-- Bảng thông báo bên phải -->
            <div class="right-panel">
                <h5>Thông Báo</h5>
                <div id="status-display">
                    <div class="status-item bg-secondary text-white">
                        <strong>Biển Số:</strong> <span id="plate">---</span>
                    </div>
                    <div class="status-item bg-secondary text-white">
                        <strong>Trạng Thái:</strong> <span id="status">Đang chờ...</span>
                    </div>
                    <div class="status-item bg-secondary text-white">
                        <strong>Thời Gian:</strong> <span id="timestamp">--:--:--</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Phần dưới: Kết quả biển số -->
        <div class="bottom-section">
            <h5>Các Biển Số Đã Nhận Diện</h5>
            <div id="detected-plates" class="detected-plates">
                <!-- Kết quả sẽ được thêm vào đây -->
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;

        function startRealtime() {
            isRunning = true;
            document.getElementById('video').style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            fetch('/start_realtime');
        }

        function stopRealtime() {
            isRunning = false;
            document.getElementById('video').style.display = 'none';
            document.getElementById('placeholder').style.display = 'flex';
            fetch('/stop_realtime');
        }

        function exitApp() {
            window.location.href = '/';
        }

        // Cập nhật status mỗi giây
        setInterval(function() {
            if (isRunning) {
                fetch('/api/status')
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('plate').textContent = data.plate;
                        document.getElementById('status').textContent = data.status;
                        document.getElementById('timestamp').textContent = data.timestamp;
                        
                        // Thay đổi màu theo trạng thái
                        const statusElement = document.getElementById('status').parentElement;
                        statusElement.className = 'status-item';
                        if (data.color === 'success') {
                            statusElement.classList.add('bg-success', 'text-white');
                        } else if (data.color === 'warning') {
                            statusElement.classList.add('bg-warning', 'text-dark');
                        } else if (data.color === 'danger') {
                            statusElement.classList.add('bg-danger', 'text-white');
                        } else {
                            statusElement.classList.add('bg-secondary', 'text-white');
                        }

                        // Thêm vào danh sách nếu có biển số mới
                        if (data.plate !== '---' && data.plate !== '') {
                            addDetectedPlate(data);
                        }
                    });
            }
        }, 1000);

        function addDetectedPlate(data) {
            const container = document.getElementById('detected-plates');
            const existing = Array.from(container.children).find(card => card.querySelector('.plate-text').textContent === data.plate);
            if (!existing) {
                const card = document.createElement('div');
                card.className = 'plate-card';
                card.innerHTML = `
                    <div class="plate-text">${data.plate}</div>
                    <div class="plate-status">${data.status}</div>
                    <div class="plate-time">${data.timestamp}</div>
                `;
                container.appendChild(card);
                container.scrollTop = container.scrollHeight; // Cuộn xuống
            }
        }
    </script>
</body>
</html>
